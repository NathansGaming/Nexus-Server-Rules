name: GlowFusion
version: '${version}'
main: com.realsociety.glowfusion.GlowFusionPlugin
api-version: '26.2'
author: RealSociety
description: >
  Lets differently-colored slabs visually fuse together into a single block,
  makes buttons glow like real light sources while they're pressed/powered,
  lets levers instantly swap a built region between two saved states
  (pop-outs, awnings, drop-down ramps, and the like), lets slabs stand up
  vertically against a wall, lets a 4x4 grid of small colored tiles be
  painted onto any single block face for stripes, pixel art, and signage,
  and raises every normally-stackable item's max stack size up to
  vanilla's own hard ceiling of 99.

commands:
  glowfusion:
    description: Reload GlowFusion's configuration, recover a stuck block, or toggle your own mini-block paint mode.
    usage: /<command> reload|unstick|mini
    aliases: [gf]
  popout:
    description: Capture and bind a lever-activated pop-out/awning/ramp.
    usage: /<command> help
    permission: glowfusion.popout.admin

permissions:
  glowfusion.admin:
    description: Allows reloading the GlowFusion config.
    default: op
  glowfusion.fuse:
    description: Allows fusing two different-colored slabs into one block.
    default: true
  glowfusion.glow:
    description: Allows a player's button presses to trigger the glow effect.
    default: true
  glowfusion.popout.admin:
    description: Allows selecting, capturing, binding, and removing popouts.
    default: op
  glowfusion.vertical:
    description: Allows standing a placed slab up vertically against a wall.
    default: true
  glowfusion.miniblocks:
    description: Allows painting mini-block mosaic tiles onto a block face.
    default: true
