name: NexusMorality
version: ${project.version}
main: com.nexusuniverse.morality.NexusMorality
api-version: '1.21'
author: Nexus Universe
description: Rare survivor-NPC encounters that ask a real question - help them, or loot and leave. Tracks a lightweight per-player karma stat and exposes it as a public API for other Nexus plugins to build on (see NexusMoralityApi).

commands:
  nexusmorality:
    description: NexusMorality administration.
    aliases: [morality, nmorality]
    usage: /nexusmorality <trigger [player]|karma <player>|list|reload>
    permission: nexusmorality.admin

permissions:
  nexusmorality.admin:
    description: Manage NexusMorality.
    default: op
