name: NexusKairos
version: 0.1.0
main: com.nexusuniverse.kairos.NexusKairosPlugin
api-version: '1.21'
author: NexusUniverse

commands:
  kairos:
    description: Summon and manage the Kairos boss fight.
    usage: /kairos <summon|status|forcetier|reset>
    aliases: [nk]

permissions:
  nexuskairos.admin:
    description: Can force tiers and reset fight state.
    default: op
