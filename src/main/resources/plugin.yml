name: NexusDreams
version: ${project.version}
main: com.nexusuniverse.dreams.NexusDreams
api-version: '1.21'
author: Nexus Universe
softdepend: [NexusSurvival]
description: Sleeping through the night triggers a short dream sequence shaped by the player's current survival state - a real buff for a clean, healthy sleep, and something worse the rougher shape you're in. Reads NexusSurvival's thirst/radiation/hygiene/infection stats when installed, falls back to vanilla health/hunger otherwise.

commands:
  nexusdreams:
    description: NexusDreams administration.
    aliases: [dreams, ndreams]
    usage: /nexusdreams <trigger [player]|reload>
    permission: nexusdreams.admin

permissions:
  nexusdreams.admin:
    description: Manage NexusDreams.
    default: op
