name: NexusChroma
version: 0.1.0
main: com.nexusuniverse.chroma.NexusChromaPlugin
api-version: '1.21'
author: Nexus Universe
description: Turns blocks placed in item frames into flat solid-color squares instead of showing the item itself.
commands:
  nexuschroma:
    description: NexusChroma administration.
    aliases: [chroma, nc]
    usage: "/nexuschroma <info|list [page]|add <material> <hex>|remove <material>|reload>"
permissions:
  nexuschroma.use:
    description: Lets a player convert a block placed in an item frame into a chroma square.
    default: true
  nexuschroma.admin:
    description: Manage NexusChroma's color table (add/remove/reload).
    default: op
