name: VoidRescue
version: '1.0.0'
main: com.nexus.voidrescue.VoidRescuePlugin
api-version: '1.21'
author: RealSociety
description: Automatically rescues players who fall below the world or get stuck in a dead-but-unrespawned state (notably Bedrock players joining through Geyser), plus a manual /voidrescue override for players already stuck right now.
folia-supported: false

commands:
  voidrescue:
    description: Rescue a player stuck in the void or a stuck-dead state.
    usage: /voidrescue <playerName|all|reload>
    permission: voidrescue.admin
    aliases: [vr]

permissions:
  voidrescue.admin:
    description: Allows using /voidrescue to manually rescue players.
    default: op
  voidrescue.notify:
    description: Receive in-game notifications when a player is automatically rescued.
    default: op
