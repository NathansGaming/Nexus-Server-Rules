name: NexusRealms
version: ${project.version}
main: com.nexusuniverse.realms.NexusRealmsPlugin
api-version: '1.21'
author: Nexus Universe
softdepend: [Vault, NexusEconomy]
description: Teams (countries) claim large chunk-grid territory with a real rank hierarchy (leader/officer/member) and their own configurable protection settings (outsider door/container/PvP access); any current member can then stake a small, configurable-radius personal claim inside that territory, and that claim's owner can individually trust specific players -- team member or not -- as a visitor (interact only) or builder, nested one layer deeper than team membership itself. Plus a standalone named-home system with a permission-gated per-player cap, and a from-scratch CoreProtect-style logging/lookup/rollback/watchlist system.

commands:
  team:
    description: Create and manage your team (country) -- ranks, invites, and territory-wide protection settings.
    usage: /team <create <name>|invite <player>|kick <player>|leave|disband|info [name]|promote <player>|demote <player>|transfer <player>|settings <doors|containers|pvp> <on|off>>
  realms:
    description: Claim/unclaim chunk-grid land for your team (officer+ only), buy your team more chunk cap, and (admins) bypass land protection or bulk-claim territory.
    aliases: [land]
    usage: /realms <claim|unclaim [all]|info|tiers|upgrade <chunks>|openterrain <build|containers|doors|pvp|elytra> <on|off>|bypass|admin <claim|unclaim> <team> <radius>>
  pclaim:
    description: Stake a small personal claim inside your team's territory, and individually trust visitors into it.
    aliases: [plot]
    usage: /pclaim <create [label]|remove|list|trust <player> <visitor|builder>|untrust <player>>
  sethome:
    description: Set a named home at your current location.
    usage: /sethome [name]
  home:
    description: Teleport to one of your homes.
    usage: /home [name]
  delhome:
    description: Delete one of your homes.
    usage: /delhome [name]
  homes:
    description: List your homes.
    usage: /homes
  protect:
    description: Look up, roll back, and inspect player activity -- the anti-grief/backup system.
    usage: /protect <lookup|rollback> <player <name>|radius <n>|time <e.g. 2h>> | inspect <player> | watch <add|remove|list> [material]
  redit:
    description: A WorldEdit-inspired region editor -- operators can use it anywhere, players only inside their own personal claims.
    usage: /redit <wand|pos1|pos2|set <material>|replace <from> <to>|walls <material>|outline <material>|copy|paste|rotate <degrees>|undo>
  nexusguide:
    description: Re-issue the Nexus Realms Handbook to a player who's lost their copy.
    usage: /nexusguide give <player>

permissions:
  nexusrealms.homes.admin:
    description: Raises your home limit to homes.max-admin instead of homes.max-default.
    default: op
  nexusrealms.protect.admin:
    description: Use /protect lookup, rollback, inspect, and watchlist management.
    default: op
  nexusrealms.protect.notify:
    description: Receive live chat notifications when a player obtains a watchlisted item.
    default: op
  nexusrealms.worldedit.use:
    description: Use /redit, restricted to your own personal claims.
    default: true
  nexusrealms.worldedit.admin:
    description: Use /redit anywhere, not just your own claims.
    default: op
  nexusrealms.guidebook.admin:
    description: Re-issue the guidebook to a player who's lost their copy.
    default: op
  nexusrealms.openterrain.admin:
    description: Change open terrain default rules with /realms openterrain.
    default: op
  nexusrealms.chunks.optier:
    description: Get the cheaper, higher-ceiling chunk-cap upgrade pricing when running /realms upgrade.
    default: op
  nexusrealms.bypass:
    description: Ignore all land protection everywhere (personal claims, team territory, open terrain pvp) -- on automatically, toggle with /realms bypass.
    default: op
  nexusrealms.land.admin:
    description: Bulk-claim or -unclaim a large square of chunks for any team with /realms admin claim|unclaim.
    default: op
