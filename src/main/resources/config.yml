# NexusMorality configuration.
#
# Adjust and run /nexusmorality reload to apply. Already-active encounters
# keep the settings they spawned with until they resolve or expire; only
# new encounters pick up a changed value.

encounter:
  enabled: true

  # How often (in seconds) the plugin rolls for a new encounter near each
  # eligible online player. This is a check interval, not a guaranteed
  # spawn - see spawn-chance below.
  check-interval-seconds: 30

  # Chance, per eligible player, per check above, that an encounter
  # spawns near them. Kept low on purpose - this is meant to feel like a
  # rare, memorable moment, not a recurring mob type.
  spawn-chance: 0.03

  # Hard cap on how many unresolved encounters can exist across the whole
  # server at once, regardless of player count. Stops a lucky streak of
  # rolls from flooding the world with survivors.
  max-concurrent: 3

  # A player who just had an encounter spawn near them won't have another
  # one roll in their favor again until this many seconds pass - keeps
  # any one player from being singled out repeatedly in a short window.
  player-cooldown-seconds: 900

  # Encounters spawn between this min and max horizontal distance (blocks)
  # from the player who triggered the roll.
  min-distance-blocks: 15
  max-distance-blocks: 30

  # Never spawns within this many blocks of the world's spawn location -
  # keeps the immediate spawn area from feeling cluttered with scripted
  # content.
  min-distance-from-world-spawn: 200

  # An unresolved encounter (nobody helped or looted it) despawns quietly
  # after this many seconds - no karma change either way. Not helping
  # isn't punished, only actively looting is.
  despawn-seconds: 300

  # How close a player needs to stay to the survivor, in blocks, once
  # they've offered an item, for it to count as genuinely helping rather
  # than a drive-by item toss.
  help-radius-blocks: 6

  # How many consecutive seconds a player needs to stay within
  # help-radius-blocks after offering an item before the encounter
  # resolves as HELPED. Leaving the radius early resets the hold - they
  # can walk back and try again, the encounter doesn't fail outright.
  help-hold-seconds: 5

  # Right-clicking a survivor with one of these items (or anything
  # Material#isEdible() already covers, e.g. carrots/melon slices not
  # explicitly listed here) offers help. POTION is included deliberately
  # since Material#isEdible() doesn't cover drinking - this is meant to
  # accept a water bottle too, not just food.
  accepted-help-items:
    - BREAD
    - COOKED_BEEF
    - COOKED_PORKCHOP
    - COOKED_CHICKEN
    - COOKED_MUTTON
    - COOKED_RABBIT
    - COOKED_COD
    - COOKED_SALMON
    - APPLE
    - GOLDEN_APPLE
    - POTION

  # Dropped at the survivor's feet when an encounter resolves as HELPED -
  # a small thank-you, not meant to be a real reward loop.
  help-reward-items:
    - EMERALD

  # Dropped at the survivor's feet the moment an encounter resolves as
  # LOOTED (immediately on the first hit that connects, not on eventual
  # death) - "their meager supplies," and deliberately a little more
  # generous than the thank-you drop above. The loot path is supposed to
  # be a real temptation, not just a penalty with nothing to show for it.
  loot-reward-items:
    - BREAD
    - BREAD
    - IRON_NUGGET

karma:
  # Added to a player's karma on a successful HELPED resolution.
  help-reward: 10

  # Subtracted from a player's karma on a LOOTED resolution. Weighted
  # heavier than the reward on purpose - the dark path should cost more
  # than the good path pays, not just be a mirror image of it.
  loot-penalty: 15
