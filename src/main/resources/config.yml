# GlowFusion configuration

dual-slabs:
  enabled: true
  # If true, players need the glowfusion.fuse permission (default: granted to everyone).
  require-permission: true
  # Play a sound effect when two slabs are fused together.
  play-sound: true
  # Consume the held slab item from the player's hand in Survival mode.
  consume-item: true

glowing-buttons:
  enabled: true
  require-permission: true
  # Light level placed while a button is powered/pressed. Vanilla light levels run 0-15.
  light-level: 15
  # How often (in ticks) the plugin double-checks that light blocks still match
  # a currently-powered button, in case an event was missed (e.g. from another
  # plugin toggling redstone directly). 20 ticks = 1 second.
  verification-interval-ticks: 100

popouts:
  enabled: true
  # Safety cap on how many blocks a single /popout saveoff or /popout saveon
  # region may contain, to keep a mis-selected region from freezing the
  # server for a moment. A typical awning or ramp is well under a thousand.
  max-blocks: 20000

vertical-slabs:
  enabled: true
  require-permission: true

# Lets a player right-click a spot on the face of any plain, non-interactive
# block while holding a colored/archetype block to paint a small tile there
# - stack enough of them and you get real pixel-art, stripes, or signage on
# a wall, all on ONE real block's face. Same "visual, not physical" idea as
# vertical-slabs above: each tile is a small BlockDisplay, not a real block,
# so there's no fine collision to match the pattern (walking into a painted
# wall still just hits the one real solid block underneath, same as usual).
# Unlike vertical-slabs, the real block is never modified - a mosaic is a
# decal added on top of an existing face, so it works on any wall/floor
# you've already built without giving up that block's own solidity, and
# there's no YAML store or crash-desync risk here since nothing about the
# real block ever changes.
#
# Controls, both while looking at the exact spot on the face you want:
# right-click with an eligible material in hand paints that cell (replacing
# whatever was already there); sneak + right-click with an empty hand
# erases just that one cell. Breaking the real block clears every tile on
# every face of it at once.
# Bumps every normally-stackable item's max stack size up (default vanilla
# is 64, or 16 for things like snowballs/eggs/ender pearls) to one shared
# number, applied server-wide to everyone at once - this changes a core
# game rule, not something an individual player opts into, so unlike the
# features above there's no per-player permission gate for the size itself
# (that would make two players holding the same material stack differently
# and be unable to combine them, which would just look like a bug).
#
# HONEST LIMIT: 99 is the real ceiling here, and it comes from the game
# itself, not from GlowFusion. Since Minecraft 1.20.5, stack size is one of
# vanilla's own built-in "data components" (the same mechanism behind a
# custom name or enchantments), and both the client and server hard-clamp
# that component to 1-99 no matter what any plugin asks for - there is no
# way, from a plugin or otherwise, to push a normal item's stack past 99.
# Tools, weapons, and armor are untouched either way: vanilla itself
# refuses to combine a stack size above 1 with durability, so anything
# already capped at 1 by the game stays at 1 here too.
#
# Because stack size lives on the individual item (again, like a custom
# name would), GlowFusion has to actively stamp it onto every item as it's
# crafted, looted, dropped, picked up, or moved - see the plugin's own
# README for the full list of what's covered - plus a periodic sweep of
# every online player's own inventory/ender chest as a safety net for
# anything that arrives some other way (an admin's /give, an economy
# plugin's shop, and the like).
bigger-stacks:
  enabled: true
  max-stack-size: 99
  # How often (in seconds) the safety-net sweep re-checks every online
  # player's inventory and ender chest. Lower catches stray un-stamped
  # items faster; higher is slightly cheaper on a very populated server.
  resync-interval-seconds: 10

mini-blocks:
  enabled: true
  require-permission: true
  # Consume the held item from the player's hand in Survival mode.
  consume-item: true
  play-sound: true
  # Extra "plain" full-block archetypes beyond the 16-color families
  # (wool/concrete/concrete powder/terracotta/glazed terracotta/stained
  # glass), which are generated automatically for every dye color - no need
  # to list those here. Material names must match Paper's own Material enum
  # names exactly (case-insensitive); an unrecognized name is skipped with a
  # console warning at startup rather than breaking the whole list. This
  # list is intentionally not exhaustive - add more freely.
  plain-block-materials:
    - STONE
    - COBBLESTONE
    - MOSSY_COBBLESTONE
