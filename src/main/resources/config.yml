# NexusSurvival mob & disease tuning
#
# Adjust these and run /nexussurvival reload to apply. Takes effect
# immediately for ongoing checks (infection rolls, spawn rolls) -- it does
# NOT retroactively change mobs/effects already in progress (e.g. a
# player's current severity timer keeps its old pacing until it next
# advances).

# A single, fixed WorldSpawn point. Applied as the real World spawn location on enable, so
# anything that reads world spawn under the hood (vanilla's own no-bed death respawn, another
# plugin's own "/spawn" command, the F3 debug screen marker) resolves here automatically --
# nothing else on the server needs to know NexusSurvival exists for this to work. Also forced
# explicitly on every brand-new player's very first join, and re-applied as a safety net on any
# respawn that isn't from a bed or respawn anchor. Everyone (not just admins) can also run
# /worldspawn to teleport here on demand.
spawn:
  enabled: true
  # leave blank ("") to use the server's first/default world
  world: ""
  x: -16648
  y: 72
  z: 9645
  yaw: 0.0
  pitch: 0.0

mobs:
  feral-zombie:
    natural-spawn-chance: 0.05
  tnt-zombie:
    natural-spawn-chance: 0.03
  plague-carriers:
    natural-spawn-chance: 0.06
    # both of these are also scaled by disease.chance-multiplier below
    bite-infection-chance: 0.35
    proximity-infection-chance: 0.05
  turning:
    # chance a zombie/husk/drowned bite turns a nearby passive animal into
    # a fresh disease carrier instead of just killing it (villagers are
    # excluded -- vanilla already handles zombie-villager conversion)
    chance: 0.25

disease:
  # MASTER DIAL: multiplies every disease infection roll in the plugin --
  # biome/block/mob contact, person-to-person contagion, plague sites,
  # dirty-armor hygiene infection, raw (unboiled) water, and Plague Carrier
  # bite/proximity -- on top of each one's own rate below. 1.0 = no change
  # from those rates; turn this down for rarer diseases server-wide
  # without having to hand-edit every individual chance, turn it up for
  # more common ones. This is the knob to reach for first.
  chance-multiplier: 0.35
  # how long an uncured infection takes to advance one severity tier, in seconds
  severity-interval-seconds: 120
  # damage dealt per symptom pulse once severity reaches CRITICAL
  critical-damage: 2.0
  # generic environmental sourcing (Disease.sourceBlocks/sourceMobs/sourceBiomes) --
  # NOT the same as the dedicated Plague Carrier chances above.
  # Each of these is also scaled by chance-multiplier above.
  block-contact-chance: 0.10
  mob-contact-chance: 0.10
  biome-exposure-chance: 0.08
  # dirty armor (see hygiene section elsewhere) rolling this chance each
  # check once fully dirty. Also scaled by chance-multiplier above.
  hygiene-infection-chance: 0.05
  # drinking untreated/raw water instead of a properly boiled Water
  # Bottle. Also scaled by chance-multiplier above.
  raw-water-contamination-chance: 0.15
  # after curing a disease, you're immune to catching anything new for this
  # long -- stops the "cured, then instantly sick again" loop
  post-cure-immunity-minutes: 60

seasons:
  # multiplies the chances above (plus the Feral/TNT/Plague Carrier natural
  # spawn chances) based on the current season -- ONLY has an effect if
  # NexusSeasons is installed and enabled. 1.0 = no change. If NexusSeasons
  # isn't present, everything just runs at its normal (non-seasonal) rate.
  danger-multiplier:
    spring: 1.0
    summer: 1.15
    fall: 1.1
    winter: 1.3

# Season/weather physically affecting the player -- ONLY has an effect if
# NexusSeasons is installed and enabled, same as danger-multiplier above.
# "Exposed" means standing outdoors under open sky (no roof/overhang above
# you) -- shelter fully protects against both winter and summer effects
# below, which is the whole point of building somewhere to get out of it.
climate:
  enabled: true

  winter:
    # while it's actively snowing (storming, in a cold enough biome/altitude
    # that vanilla itself would render it as snow rather than rain) and
    # you're exposed, hypothermia advances one stage every this many
    # seconds, up to max-stage. Ducking indoors starts recovery immediately.
    exposure-seconds-per-stage: 30
    recovery-seconds-per-stage: 20
    # stage 1: slowness. 2: worse slowness + mining fatigue. 3: + nausea.
    # 4 (default max): all of the above + a chance of real damage each
    # second -- genuine hypothermia, not just an inconvenience.
    max-stage: 4

  summer:
    # exposed to direct sun (no storm) advances heat exhaustion the same
    # way winter's snow exposure advances hypothermia
    exposure-seconds-per-stage: 30
    recovery-seconds-per-stage: 20
    # stage 1: weakness. 2: + mining fatigue. 3 (default max): + hunger.
    max-stage: 3
    # thirst drains this many times faster (via NexusSurvival's own thirst
    # bar) while any heat-exhaustion stage is active -- 1.0 = no change
    thirst-drain-multiplier: 1.75

  mild-seasons:
    # spring and fall: while outdoors, roll this chance every
    # check-interval-seconds for a short "pleasant weather" regeneration
    # buff. Purely a bonus -- nothing bad happens in spring/fall from this
    # system, on purpose, to make them feel like the genuine relief they'd
    # be after a rough winter or summer.
    check-interval-seconds: 60
    buff-chance: 0.25
    buff-duration-seconds: 20
